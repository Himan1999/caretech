<body>
<header><div class="logo">Eldavise</div><nav id="nav"></nav></header>
<main id="app">Loading…</main>
<footer class="site-footer"><div><h2>Eldavise</h2><p>Friendly, practical digital help for real life. Set up properly. Explained simply.</p></div><div class="footer-links"><h3>Explore</h3><button onclick="go('services')">Services</button><button onclick="go('shop')">Accessories</button><button onclick="go('cart')">Your cart</button></div><div class="footer-links"><h3>Need help?</h3><span>hello@eldavise.local</span><span>Mon-Fri, 9am-6pm</span><span>At home and online</span></div><div class="footer-bottom">&copy; 2026 Eldavise. Technology made less complicated.</div></footer>
<div id="msg" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const ST = ['New', 'Confirmed', 'In progress', 'Completed', 'Cancelled'];
const viewFromUrl = () => { const params = new URLSearchParams(location.search); return params.has('reset') ? 'reset' : params.get('view') || 'services'; };
let cat = { services: [], products: [] }, view = viewFromUrl();
let cart = JSON.parse(localStorage.cart || '[]'), tok = localStorage.tok, me = JSON.parse(localStorage.me || 'null'), notifications = [];
let shopFilter = { search: '', category: 'All', brand: 'All' };
let resetToken = new URLSearchParams(location.search).get('reset') || '';
let registrationEmail = '';
let accountCheckTimer;
let adminOrderSearch = '';
let adminSection = 'dashboard';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const validEmail = email => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
const money = n => '$' + Number(n).toFixed(2);
const flash = m => { $('#msg').textContent = m; setTimeout(() => $('#msg').textContent = '', 3000); };
const api = async (p, m = 'GET', b) => {
  const r = await fetch('/api' + p, { method: m, headers: { 'Content-Type': 'application/json', ...(tok && { Authorization: 'Bearer ' + tok }) }, body: b && JSON.stringify(b) });
  const body = await r.text();
  let d;
  try { d = JSON.parse(body); } catch { d = { error: 'The server returned an unexpected response. Please restart the Eldavise server and try again.' }; }
  if (!r.ok) throw Error(d.error || 'Something went wrong');
  return d;
};
const item = c => (c.type === 'service' ? cat.services : cat.products).find(x => x.id === c.id);
const total = () => cart.reduce((s, c) => s + (item(c)?.price || 0) * c.qty, 0);
const saveCart = () => { localStorage.cart = JSON.stringify(cart); draw(); };
const add = (type, id) => { const c = cart.find(x => x.type === type && x.id === id); c ? c.qty++ : cart.push({ type, id, qty: 1 }); saveCart(); flash('Added to cart'); };
const go = v => {
  view = v;
  const params = new URLSearchParams(location.search);
  if (v === 'reset') params.delete('view'); else { params.delete('reset'); params.set('view', v); }
  const query = params.toString();
  history.pushState({}, '', location.pathname + (query ? '?' + query : ''));
  draw();
};
const adminGo = section => { adminSection = section; draw(); };
window.addEventListener('popstate', () => { view = viewFromUrl(); resetToken = new URLSearchParams(location.search).get('reset') || ''; draw(); });
const images = {
  s1: 'https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=900&q=85',
  s2: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=85',
  s3: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=85',
  p1: 'https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=700&q=85',
  p2: 'https://images.unsplash.com/photo-1625842268584-8f3296236761?auto=format&fit=crop&w=700&q=85',
  p3: 'https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=700&q=85',
  p4: 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=700&q=85',
  p5: 'https://images.unsplash.com/photo-1601593346740-925612772716?auto=format&fit=crop&w=700&q=85',
  p6: 'https://images.unsplash.com/photo-1556656793-08538906a9f8?auto=format&fit=crop&w=700&q=85',
  p7: 'https://images.unsplash.com/photo-1568667256549-094345857637?auto=format&fit=crop&w=700&q=85',
  p8: 'https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=700&q=85'
};
const image = (id, alt, cls = 'card-image') => `<img class="${cls}" src="${images[id] || images.s2}" alt="${esc(alt)}" loading="lazy">`;
const productImage = p => p.imageUrl ? `<img class="card-image" src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy">` : image(p.id, p.name);
const productMeta = p => [p.brand, p.variant, p.compatibility, p.size].filter(Boolean).map(value => `<span class="tag">${esc(value)}</span>`).join('');

const alertsHtml = () => notifications.length ? `<div class="notice-panel"><div class="section-heading"><h2>Notifications</h2><span>${notifications.filter(n => !n.isRead).length} unread</span></div>${notifications.slice(0, 5).map(n => `<div class="notice ${n.isRead ? '' : 'unread'}"><div><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small>${new Date(n.created).toLocaleString()}</small></div>${n.isRead ? '' : `<button class="ghost" onclick="readNotification(${n.id})">Mark read</button>`}</div>`).join('')}</div>` : '<div class="notice-panel"><b>No notifications yet</b><p class="lead">Order updates will appear here.</p></div>';
const statusHtml = status => `<span class="tag status-${status.toLowerCase().replaceAll(' ', '-')}">${esc(status)}</span>`;
const orderSteps = ['New', 'Confirmed', 'In progress', 'Completed'];
const timelineDate = (order, step) => step === 'New' ? order.created : notifications.find(n => n.orderId === order.id && n.title === 'Order status updated' && n.message.includes(`now ${step}`))?.created;
const timelineHtml = (status, order) => status === 'Cancelled' ? `<div class="timeline-step timeline-cancelled">Cancelled${timelineDate(order, status) ? `<small class="timeline-time">${new Date(timelineDate(order, status)).toLocaleString()}</small>` : ''}</div>` : `<div class="timeline">${orderSteps.map((step, index) => `<div class="timeline-step ${index < orderSteps.indexOf(status) ? 'done' : index === orderSteps.indexOf(status) ? 'current' : ''}">${esc(step)}${timelineDate(order, step) ? `<small class="timeline-time">${new Date(timelineDate(order, step)).toLocaleString()}</small>` : ''}</div>`).join('')}</div>`;

const ordersHtml = (os, adm) => {
  if (!os.length) return '<p>No orders yet.</p>';
  const statusRank = { New: 0, Confirmed: 1, 'In progress': 2, Completed: 3, Cancelled: 4 };
  const sorted = os.slice().sort((a, b) => adm ? (statusRank[a.status] - statusRank[b.status]) || (new Date(b.created) - new Date(a.created)) : new Date(b.created) - new Date(a.created));
  return sorted.map(o => {
    const summary = `<div><b>Order ${esc(o.id)}</b> — ${new Date(o.created).toLocaleString()}${adm ? ` — ${esc(o.customer)} (${esc(o.email)})` : ''}</div>`;
    const content = `<div>${o.lines.map(l => `${esc(l.name)} × ${l.qty}`).join(', ')}</div><div><b>${money(o.total)}</b>${o.date ? ` — visit on ${esc(o.date)}` : ''}${o.address ? ` at ${esc(o.address)}` : ''}</div>${o.notes ? `<div><i>${esc(o.notes)}</i></div>` : ''}<div>${adm ? `<select onchange="setStatus('${o.id}',this.value)">${ST.map(s => `<option ${s == o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` : `<span class="tag">${esc(o.status)}</span>`}</div>${timelineHtml(o.status, o)}`;
    return adm && o.status === 'Completed' ? `<details class="card completed-order"><summary>${summary}<span class="tag">Completed</span></summary>${content}</details>` : `<div class="card">${summary}${content}</div>`;
  }).join('');
};

const adminCharts = orders => {
  const days = Array.from({ length: 7 }, (_, index) => { const date = new Date(); date.setHours(0, 0, 0, 0); date.setDate(date.getDate() - (6 - index)); return date; });
  const daily = days.map(day => orders.filter(order => { const created = new Date(order.created); return created.toDateString() === day.toDateString(); }));
  const sales = daily.map(dayOrders => dayOrders.filter(order => order.status !== 'Cancelled').reduce((sum, order) => sum + order.total, 0));
  const counts = daily.map(dayOrders => dayOrders.length);
  const maxSales = Math.max(...sales, 1), maxOrders = Math.max(...counts, 1);
  const categories = {};
  orders.forEach(order => order.lines.forEach(line => { if (line.type === 'product') { const product = cat.products.find(item => item.id === line.id); const category = product?.category || 'Other'; categories[category] = (categories[category] || 0) + line.qty; } }));
  const categoryRows = Object.entries(categories).sort((a, b) => b[1] - a[1]).slice(0, 6), maxCategory = Math.max(...categoryRows.map(row => row[1]), 1);
  const bars = (values, max, moneyValue) => values.map((value, index) => `<div class="bar-column"><span class="bar-value">${moneyValue ? money(value) : value}</span><div class="bar-fill" style="height:${Math.max(3, value / max * 100)}%"></div><span class="bar-label">${days[index].toLocaleDateString(undefined, { weekday: 'short' })}</span></div>`).join('');
  return `<div class="charts-grid"><div class="chart-card"><h3>Daily sales</h3><div class="bar-chart">${bars(sales, maxSales, true)}</div></div><div class="chart-card"><h3>Daily orders</h3><div class="bar-chart">${bars(counts, maxOrders, false)}</div></div><div class="chart-card"><h3>Categories sold</h3><div class="category-list">${categoryRows.map(([name, count]) => `<div class="category-row"><span>${esc(name)}</span><div class="category-track"><div class="category-fill" style="width:${count / maxCategory * 100}%"></div></div><b>${count}</b></div>`).join('') || '<span class="lead">No product sales yet.</span>'}</div></div></div>`;
};

async function draw() {
  if (me && tok) { try { notifications = await api('/notifications'); } catch { notifications = []; } }
  const tabs = [['services', 'Services'], ['shop', 'Accessories'], ['cart', `Cart (${cart.reduce((n, c) => n + c.qty, 0)})`]];
  if (me) tabs.push(['orders', 'My orders']);
  if (me?.role === 'admin') tabs.push(['admin', 'Admin']);
  const unread = notifications.filter(n => !n.isRead).length;
  $('#nav').innerHTML = tabs.map(([v, l]) => `<button class="${v === view ? 'on' : 'ghost'}" onclick="go('${v}')">${l}</button>`).join(' ') + ' ' + (me ? `<button class="alert-bell ${view === 'orders' ? 'on' : ''}" title="Notifications" aria-label="Notifications" onclick="go('orders')">&#128276;${unread ? '<i class="unread-dot"></i>' : ''}</button> <button class="ghost" onclick="logout()">Log out (${esc(me.name)})</button>` : `<button class="${view === 'login' ? 'on' : 'ghost'}" onclick="go('login')">Log in</button>`);
  try { $('#app').innerHTML = await V[view](); }
  catch (e) { if (e.message === 'Please log in') logout(); else $('#app').innerHTML = `<p>${esc(e.message)}</p>`; }
}
async function readNotification(id) { try { await api('/notifications/' + id + '/read', 'PATCH'); draw(); } catch (e) { flash(e.message); } }
async function authGo(mode) {
  const email = $('#em').value.trim();
  if (!validateEmailField('em', 'loginEmailError')) return;
  try {
    const d = await api('/' + mode, 'POST', { email, password: $('#pw').value });
    tok = localStorage.tok = d.token; me = d.user; localStorage.me = JSON.stringify(me);
    go(me.role === 'admin' ? 'admin' : 'services');
  } catch (e) {
    if (mode === 'login' && e.message === 'Wrong email or password') $('#loginPasswordError').textContent = 'Incorrect password. Try again or use Forgot password.';
    else flash(e.message);
  }
}
function checkAccountEmail() {
  clearTimeout(accountCheckTimer);
  const email = $('#em').value.trim();
  if (!validEmail(email)) return;
  accountCheckTimer = setTimeout(async () => {
    try {
      const status = await api('/account-status?email=' + encodeURIComponent(email));
      if (!status.exists && $('#em').value.trim() === email) {
        registrationEmail = email;
        go('register');
      }
    } catch { }
  }, 300);
}
function validateEmailField(inputId, errorId) {
  const input = $('#' + inputId), error = $('#' + errorId), email = input.value.trim();
  const message = !email ? 'Email address is required' : !validEmail(email) ? 'Enter a valid email address' : '';
  error.textContent = message;
  return !message;
}
function validatePasswordField(inputId, errorId) {
  const password = $('#' + inputId).value, error = $('#' + errorId);
  const message = !password ? 'Password is required' : password.length < 8 ? 'Use at least 8 characters' : !/[A-Z]/.test(password) ? 'Add at least one uppercase letter' : !/[a-z]/.test(password) ? 'Add at least one lowercase letter' : !/\d/.test(password) ? 'Add at least one number' : '';
  error.textContent = message;
  return !message;
}
function validateMatchField(passwordId = 'regPassword', confirmationId = 'regConfirm', errorId = 'registerConfirmError') {
  const password = $('#' + passwordId).value, confirmation = $('#' + confirmationId).value, error = $('#' + errorId);
  const message = confirmation && password !== confirmation ? 'Password do not match' : '';
  error.className = message ? 'field-error' : confirmation ? 'field-success' : 'field-error';
  error.textContent = message || (confirmation ? 'Password Matched' : '');
  return !message;
}
async function registerAccount() {
  const name = $('#regName').value.trim(), email = $('#regEmail').value.trim(), password = $('#regPassword').value, confirmation = $('#regConfirm').value;
  if (!name) return flash('Enter your name');
  if (!validateEmailField('regEmail', 'registerEmailError') || !validatePasswordField('regPassword', 'registerPasswordError') || !validateMatchField()) return;
  try {
    const d = await api('/register', 'POST', { name, email, password });
    tok = localStorage.tok = d.token; me = d.user; localStorage.me = JSON.stringify(me);
    go('services'); flash('Account created');
  } catch (e) {
    if (e.message === 'This email is already registered') $('#registerEmailError').textContent = e.message;
    else flash(e.message);
  }
}
async function sendResetLink() {
  const email = $('#resetEmail').value.trim();
  if (!validateEmailField('resetEmail', 'resetEmailError')) return;
  try {
    const d = await api('/forgot-password', 'POST', { email });
    flash(d.message);
  } catch (e) { flash(e.message); }
}
async function resetPassword() {
  const password = $('#newPw').value, confirmation = $('#confirmPw').value;
  if (!validatePasswordField('newPw', 'resetPasswordError') || !validateMatchField('newPw', 'confirmPw', 'resetConfirmError')) return;
  try {
    const d = await api('/reset-password', 'POST', { token: resetToken, password });
    history.replaceState({}, '', location.pathname);
    resetToken = '';
    go('login');
    flash(d.message);
  } catch (e) { flash(e.message); }
}
async function addService() {
  try {
    await api('/services', 'POST', { name: $('#serviceName').value, desc: $('#serviceDescription').value, price: $('#servicePrice').value });
    cat = await api('/catalog'); draw(); flash('Service added');
  } catch (e) { flash(e.message); }
}
function logout() { tok = me = null; localStorage.removeItem('tok'); localStorage.removeItem('me'); go('services'); }
async function order() {
  if (!tok) return go('login');
  try {
    await api('/orders', 'POST', { items: cart, address: $('#addr').value, phone: $('#phone')?.value || '', date: $('#date').value, notes: $('#notes').value });
    cart = []; localStorage.cart = '[]'; cat = await api('/catalog'); go('orders'); flash('Order placed');
  } catch (e) { flash(e.message); }
}
async function setStatus(id, status) { try { await api('/orders/' + id, 'PATCH', { status }); flash('Status updated'); draw(); } catch (e) { flash(e.message); } }
async function addProduct() {
  try {
    await api('/products', 'POST', { name: $('#pn').value, category: $('#pc').value, brand: $('#pb').value, variant: $('#pv').value, compatibility: $('#pco').value, size: $('#psz').value, imageUrl: $('#pi').value, desc: $('#pd').value, price: $('#pp').value, stock: $('#ps').value });
    cat = await api('/catalog'); draw(); flash('Accessory added');
  } catch (e) { flash(e.message); }
}
async function delProduct(id) { await api('/products/' + id, 'DELETE'); cat = await api('/catalog'); draw(); flash('Accessory deleted'); }

api('/catalog').then(c => { cat = c; draw(); });
