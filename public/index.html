<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>careTech | Friendly tech help at home</title>
<style>
:root{--bg:#f5f7f2;--ink:#17352f;--card:#fff;--acc:#176b5b;--acc-dark:#0d5045;--onacc:#fff;--hi:#f2a65a;--mut:#61726d;--line:#dbe5df;--soft:#e7f0eb}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 "Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px max(20px,calc((100% - 1120px)/2));background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px;margin-right:auto}.logo i{font-style:normal;color:var(--acc)}
nav{display:flex;gap:6px;flex-wrap:wrap}button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:7px;padding:9px 15px;background:var(--acc);color:var(--onacc);font-weight:700;transition:transform .15s,background .15s}
button:hover{background:var(--acc-dark);transform:translateY(-1px)}button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}button.ghost:hover{background:var(--soft)}
nav button.on{background:var(--ink);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
main{max-width:1120px;margin:0 auto;padding:36px 24px 80px}
h1{font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-1.5px;margin:8px 0 14px}
.lead{color:var(--mut);max-width:60ch;margin:0 0 28px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;margin-bottom:46px}.hero-copy{padding:18px 0}.hero-copy h1{max-width:620px}.eyebrow{color:var(--acc);font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero-image{width:100%;height:310px;object-fit:cover;border-radius:14px;box-shadow:18px 18px 0 var(--soft)}.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:24px;color:var(--mut);font-size:14px}.trust b{color:var(--ink);display:block;font-size:18px}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.section-heading h2{margin:0;font-size:27px;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:7px;box-shadow:0 7px 20px rgba(23,53,47,.05)}
.card-image{width:calc(100% + 36px);height:165px;object-fit:cover;margin:-18px -18px 10px;border-radius:10px 10px 0 0}.card h3{margin:0;font-size:19px}.card p{margin:0;color:var(--mut)}.card .btn-row{margin-top:auto;padding-top:12px}.price{color:var(--ink)!important;font-weight:800;font-size:21px;margin-top:4px!important}.tag{display:inline-block;background:var(--soft);color:var(--acc-dark);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;align-self:flex-start}
.product-meta{display:flex;flex-wrap:wrap;gap:5px}.product-meta .tag{font-weight:600}.admin-form{max-width:620px}.admin-form .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-form .full{grid-column:1/-1}
.filter-bar{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;margin:0 0 24px;padding:14px;background:var(--soft);border-radius:10px}.filter-bar input,.filter-bar select{background:#fff}.results-note{color:var(--mut);font-size:13px;margin:-12px 0 18px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.form{display:grid;gap:10px;max-width:440px;margin-top:10px}
input,textarea,select{padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:var(--card);width:100%}
.auth-shell{display:grid;grid-template-columns:.9fr 1.1fr;max-width:900px;margin:16px auto 30px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 16px 40px rgba(23,53,47,.1)}.auth-art{position:relative;min-height:500px;background:var(--ink);color:#fff;padding:34px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.auth-art:after{content:"";position:absolute;inset:auto -80px -100px auto;width:280px;height:280px;border:44px solid var(--hi);border-radius:50%;opacity:.85}.auth-art-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34}.auth-art-content{position:relative;z-index:1}.auth-art h2{font-size:34px;line-height:1.08;letter-spacing:-1px;margin:10px 0 14px}.auth-art p{color:#d8e8df;max-width:28ch}.auth-points{position:relative;z-index:1;display:grid;gap:10px}.auth-points span{display:flex;align-items:center;gap:9px;font-size:14px}.auth-points b{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--hi);color:var(--ink);font-size:13px}.auth-form{padding:48px 46px}.auth-form h1{font-size:38px;margin-top:0}.auth-form .form{max-width:none;margin-top:24px}.auth-form label{font-size:13px;font-weight:800;color:var(--mut);margin-top:4px}.auth-actions{display:grid;gap:10px;margin-top:8px}.auth-actions button{width:100%}.auth-note{color:var(--mut);font-size:13px;margin:18px 0 0;text-align:center}
.notice-panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 24px;box-shadow:0 7px 20px rgba(23,53,47,.05)}.notice-panel .section-heading{margin-bottom:8px}.notice-panel .section-heading span{color:var(--mut);font-size:13px}.notice{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.notice.unread{border-left:3px solid var(--hi);padding-left:12px}.notice p{margin:2px 0;color:var(--mut)}.notice small{color:var(--mut);font-size:12px}.admin-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.admin-head h1{margin-bottom:8px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px}.metric{background:var(--ink);color:#fff;border-radius:10px;padding:18px}.metric span,.metric small{display:block;color:#a8c0b5;font-size:13px}.metric b{display:block;color:#fff;font-size:30px;margin:5px 0}.admin-section{margin-bottom:36px}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.site-footer{background:var(--ink);color:#d8e8df;padding:34px max(24px,calc((100% - 1120px)/2)) 22px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}.site-footer h2{color:#fff;margin:0 0 8px;font-size:22px}.site-footer h3{color:var(--hi);font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:4px 0 10px}.site-footer p{color:#a8c0b5;margin:0;max-width:30ch}.footer-links{display:grid;align-content:start;gap:4px}.footer-links button{background:none;color:#d8e8df;padding:2px 0;text-align:left;font-weight:400}.footer-links button:hover{color:#fff;transform:none}.footer-bottom{grid-column:1/-1;border-top:1px solid rgba(216,232,223,.18);padding-top:16px;color:#a8c0b5;font-size:13px}
#msg:empty{display:none}
.stack{display:grid;gap:10px}
@media(max-width:700px){header{padding:12px 16px}nav{width:100%;order:3}nav button{flex:1;padding:8px 7px;font-size:13px}.hero{grid-template-columns:1fr;gap:22px;margin-bottom:34px}.hero-image{height:220px;box-shadow:10px 10px 0 var(--soft)}main{padding:26px 16px 60px}.section-heading{display:block}.section-heading h2{margin-bottom:12px}.filter-bar{grid-template-columns:1fr}.auth-shell{grid-template-columns:1fr;margin:0 auto 24px}.auth-art{min-height:270px;padding:26px}.auth-art h2{font-size:29px}.auth-points{display:none}.auth-form{padding:32px 24px}.auth-form h1{font-size:34px}.admin-head{display:block}.admin-head button{margin-top:4px}.metrics{grid-template-columns:1fr 1fr}.metric b{font-size:25px}.notice{align-items:start;display:block}.notice button{margin-top:8px}.admin-form .form-grid{grid-template-columns:1fr}.admin-form .full{grid-column:auto}.site-footer{grid-template-columns:1fr 1fr;gap:24px;padding:30px 20px 18px}.site-footer>div:first-child,.footer-bottom{grid-column:1/-1}}
</style></head>
<body>
<header><div class="logo">care<i>Tech</i></div><nav id="nav"></nav></header>
<main id="app">Loading…</main>
<footer class="site-footer"><div><h2>care<i>Tech</i></h2><p>Friendly, practical technology help for real life. Set up properly. Explained simply.</p></div><div class="footer-links"><h3>Explore</h3><button onclick="go('services')">Services</button><button onclick="go('shop')">Accessories</button><button onclick="go('cart')">Your cart</button></div><div class="footer-links"><h3>Need help?</h3><span>hello@caretech.local</span><span>Mon-Fri, 9am-6pm</span><span>At home and online</span></div><div class="footer-bottom">&copy; 2026 careTech. Technology made less complicated.</div></footer>
<div id="msg" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const ST = ['New', 'Confirmed', 'In progress', 'Completed', 'Cancelled'];
let cat = { services: [], products: [] }, view = 'services';
let cart = JSON.parse(localStorage.cart || '[]'), tok = localStorage.tok, me = JSON.parse(localStorage.me || 'null'), notifications = [];
let shopFilter = { search: '', category: 'All', brand: 'All' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Number(n).toFixed(2);
const flash = m => { $('#msg').textContent = m; setTimeout(() => $('#msg').textContent = '', 3000); };
const api = async (p, m = 'GET', b) => {
  const r = await fetch('/api' + p, { method: m, headers: { 'Content-Type': 'application/json', ...(tok && { Authorization: 'Bearer ' + tok }) }, body: b && JSON.stringify(b) });
  const d = await r.json();
  if (!r.ok) throw Error(d.error || 'Something went wrong');
  return d;
};
const item = c => (c.type === 'service' ? cat.services : cat.products).find(x => x.id === c.id);
const total = () => cart.reduce((s, c) => s + (item(c)?.price || 0) * c.qty, 0);
const saveCart = () => { localStorage.cart = JSON.stringify(cart); draw(); };
const add = (type, id) => { const c = cart.find(x => x.type === type && x.id === id); c ? c.qty++ : cart.push({ type, id, qty: 1 }); saveCart(); flash('Added to cart'); };
const go = v => { view = v; draw(); };
const images = {
  s1: 'https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=900&q=85',
  s2: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=85',
  s3: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=900&q=85',
  p1: 'https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=700&q=85',
  p2: 'https://images.unsplash.com/photo-1625842268584-8f3296236761?auto=format&fit=crop&w=700&q=85',
  p3: 'https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=700&q=85',
  p4: 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=700&q=85',
  p5: 'https://images.unsplash.com/photo-1601593346740-925612772716?auto=format&fit=crop&w=700&q=85',
  p6: 'https://images.unsplash.com/photo-1556656793-08538906a9f8?auto=format&fit=crop&w=700&q=85',
  p7: 'https://images.unsplash.com/photo-1568667256549-094345857637?auto=format&fit=crop&w=700&q=85',
  p8: 'https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=700&q=85'
};
const image = (id, alt, cls = 'card-image') => `<img class="${cls}" src="${images[id] || images.s2}" alt="${esc(alt)}" loading="lazy">`;
const productImage = p => p.imageUrl ? `<img class="card-image" src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy">` : image(p.id, p.name);
const productMeta = p => [p.brand, p.variant, p.compatibility, p.size].filter(Boolean).map(value => `<span class="tag">${esc(value)}</span>`).join('');
const shopProducts = () => cat.products.filter(p => { const text = [p.name, p.desc, p.brand, p.variant, p.compatibility, p.size].join(' ').toLowerCase(); return (!shopFilter.search || text.includes(shopFilter.search.toLowerCase())) && (shopFilter.category === 'All' || p.category === shopFilter.category) && (shopFilter.brand === 'All' || p.brand === shopFilter.brand); });
const updateShopFilter = (key, value) => { shopFilter[key] = value; draw(); };
const alertsHtml = () => notifications.length ? `<div class="notice-panel"><div class="section-heading"><h2>Notifications</h2><span>${notifications.filter(n => !n.isRead).length} unread</span></div>${notifications.slice(0, 5).map(n => `<div class="notice ${n.isRead ? '' : 'unread'}"><div><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small>${new Date(n.created).toLocaleString()}</small></div>${n.isRead ? '' : `<button class="ghost" onclick="readNotification(${n.id})">Mark read</button>`}</div>`).join('')}</div>` : '<div class="notice-panel"><b>No notifications yet</b><p class="lead">Order updates will appear here.</p></div>';
const statusHtml = status => `<span class="tag status-${status.toLowerCase().replaceAll(' ', '-')}">${esc(status)}</span>`;

const ordersHtml = (os, adm) => os.length ? os.slice().reverse().map(o => `
  <div class="card"><div><b>Order ${esc(o.id)}</b> — ${new Date(o.created).toLocaleString()}${adm ? ` — ${esc(o.customer)} (${esc(o.email)})` : ''}</div>
  <div>${o.lines.map(l => `${esc(l.name)} × ${l.qty}`).join(', ')}</div>
  <div><b>${money(o.total)}</b>${o.date ? ` — visit on ${esc(o.date)}` : ''}${o.address ? ` at ${esc(o.address)}` : ''}</div>
  ${o.notes ? `<div><i>${esc(o.notes)}</i></div>` : ''}
  <div>${adm ? `<select onchange="setStatus('${o.id}',this.value)">${ST.map(s => `<option ${s == o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` : `<span class="tag">${esc(o.status)}</span>`}</div></div>`).join('') : '<p>No orders yet.</p>';

const V = {
  services: () => `<section class="hero"><div class="hero-copy"><span class="eyebrow">Technology, made simple</span><h1>Feel confident with your tech.</h1><p class="lead">Friendly, reliable help for the devices you use every day. We set things up properly, explain how they work, and leave you ready to go.</p><button onclick="document.querySelector('#services').scrollIntoView({behavior:'smooth'})">Explore our services</button><div class="trust"><span><b>5-star</b>local support</span><span><b>At home</b>or online help</span><span><b>No jargon</b>just answers</span></div></div>${image('s2','A laptop ready for setup','hero-image')}</section><section id="services"><div class="section-heading"><h2>How can we help?</h2><span class="lead">Professional setup, without the stress.</span></div><div class="grid">${cat.services.map(s => `<div class="card">${image(s.id,s.name)}<h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><p class="price">${money(s.price)}</p><div class="btn-row"><button onclick="add('service','${s.id}')">Book this service</button></div></div>`).join('')}</div></section>`,

  shop: () => { const categories = [...new Set(cat.products.map(p => p.category).filter(Boolean))].sort(), brands = [...new Set(cat.products.map(p => p.brand).filter(Boolean))].sort(), products = shopProducts(); return `<h1>Accessories</h1><p class="lead">Choose the right brand, model, size, and finish for your device.</p><div class="filter-bar"><input value="${esc(shopFilter.search)}" onchange="updateShopFilter('search',this.value)" placeholder="Search by model, brand, or accessory"><select onchange="updateShopFilter('category',this.value)"><option value="All">All categories</option>${categories.map(c => `<option ${shopFilter.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select><select onchange="updateShopFilter('brand',this.value)"><option value="All">All brands</option>${brands.map(b => `<option ${shopFilter.brand === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div><p class="results-note">Showing ${products.length} of ${cat.products.length} accessories</p><div class="grid">${products.map(p => `<div class="card">${productImage(p)}<span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><div class="product-meta">${productMeta(p)}</div><p>${esc(p.desc)}</p><p class="price">${money(p.price)}</p><p>${p.stock > 0 ? p.stock + ' in stock' : 'Out of stock'}</p><div class="btn-row"><button ${p.stock < 1 ? 'disabled' : ''} onclick="add('product','${p.id}')">Add to cart</button></div></div>`).join('') || '<p>No accessories match those options yet.</p>'}</div>`; },

  cart: () => !cart.length ? '<h1>Your cart is empty</h1><p class="lead">Book a service or add an accessory to get started.</p>' : `<h1>Your cart</h1>
    ${cart.map((c, i) => `<div class="row"><span>${esc(item(c)?.name || 'Unavailable item')} × ${c.qty}</span><span>${money((item(c)?.price || 0) * c.qty)} <button class="ghost" onclick="cart.splice(${i},1);saveCart()">Remove</button></span></div>`).join('')}
    <div class="row"><b>Total</b><b>${money(total())}</b></div>
    <h3>Service visit and delivery details</h3>
    <div class="form"><input id="addr" placeholder="Address"><input id="date" type="date"><textarea id="notes" rows="3" placeholder="Notes (device model, Wi-Fi name, anything we should know)"></textarea>
    <button onclick="order()">${tok ? 'Place order (pay on visit or delivery)' : 'Log in to place order'}</button></div>`,

  login: () => `<section class="auth-shell"><div class="auth-art">${image('s3','A person using a smartphone','auth-art-image')}<div class="auth-art-content"><span class="eyebrow">Welcome back</span><h2>Your tech, taken care of.</h2><p>Keep your bookings, support history and device details in one calm, convenient place.</p></div><div class="auth-points"><span><b>✓</b> Track every service visit</span><span><b>✓</b> Reorder useful accessories</span><span><b>✓</b> Get help without the jargon</span></div></div><div class="auth-form"><span class="eyebrow">careTech account</span><h1>Sign in and get sorted.</h1><p class="lead">Access your orders and book your next visit in seconds.</p><div class="form"><label for="nm">Name <span>(for new accounts)</span></label><input id="nm" placeholder="Your name"><label for="em">Email address</label><input id="em" type="email" placeholder="you@example.com"><label for="pw">Password</label><input id="pw" type="password" placeholder="6+ characters"><div class="auth-actions"><button onclick="authGo('login')">Log in to careTech</button><button class="ghost" onclick="authGo('register')">Create a new account</button></div></div><p class="auth-note">Your details stay private and are only used to manage your careTech orders.</p></div></section>`,

  orders: async () => `<h1>My orders</h1><p class="lead">Track your bookings, delivery details, and every careTech update.</p>${alertsHtml()}<div class="stack">${ordersHtml(await api('/orders'), false)}</div>`,

  admin: async () => {
    const [os, summary] = await Promise.all([api('/orders'), api('/admin/summary')]);
    return `<div class="admin-head"><div><span class="eyebrow">Operations center</span><h1>Admin dashboard</h1><p class="lead">Keep orders moving and customers informed.</p></div><button onclick="go('shop')">View storefront</button></div><div class="metrics"><div class="metric"><span>Customers</span><b>${summary.customers}</b><small>registered accounts</small></div><div class="metric"><span>Total orders</span><b>${summary.orders}</b><small>all time</small></div><div class="metric"><span>Open orders</span><b>${summary.openOrders}</b><small>need attention</small></div><div class="metric"><span>Revenue</span><b>${money(summary.revenue)}</b><small>excluding cancelled</small></div></div><section class="admin-section"><div class="section-heading"><h2>Order management</h2><span class="lead">Update a status to notify the customer automatically.</span></div><div class="stack">${ordersHtml(os, true)}</div></section>
    <h3>Add accessory variant</h3><div class="admin-form"><div class="form form-grid"><input id="pn" placeholder="Product name"><select id="pc"><option value="Phone accessory">Phone accessory</option><option value="Phone case">Phone case</option><option value="Tempered glass">Tempered glass</option><option value="Ink cartridge">Ink cartridge</option><option value="Laptop sleeve">Laptop sleeve</option><option value="Cables">Cables</option><option value="Laptop">Laptop</option><option value="Printer">Printer</option><option value="Other">Other</option></select><input id="pb" placeholder="Brand (Apple, HP, Samsung)"><input id="pv" placeholder="Variant or model (iPhone 15 Pro, Black) "><input id="pco" placeholder="Compatibility (device or printer model)"><input id="psz" placeholder="Size (13-inch, XL, A4)"><input id="pp" type="number" step="0.01" placeholder="Price"><input id="ps" type="number" placeholder="Stock"><input id="pi" class="full" placeholder="Image URL (https://...)"><textarea id="pd" class="full" rows="2" placeholder="Description"></textarea><button class="full" onclick="addProduct()">Add accessory variant</button></div></div>
    <h3>Accessories</h3>${cat.products.map(p => `<div class="row"><span>${esc(p.name)}${p.brand ? ` — ${esc(p.brand)}` : ''}${p.variant ? ` / ${esc(p.variant)}` : ''} — ${money(p.price)} — ${p.stock} in stock</span><button class="ghost" onclick="delProduct('${p.id}')">Delete</button></div>`).join('')}`;
  }
};

async function draw() {
  if (me && tok) { try { notifications = await api('/notifications'); } catch { notifications = []; } }
  const tabs = [['services', 'Services'], ['shop', 'Accessories'], ['cart', `Cart (${cart.reduce((n, c) => n + c.qty, 0)})`]];
  if (me) tabs.push(['orders', 'My orders']);
  if (me?.role === 'admin') tabs.push(['admin', 'Admin']);
  const unread = notifications.filter(n => !n.isRead).length;
  $('#nav').innerHTML = tabs.map(([v, l]) => `<button class="${v === view ? 'on' : 'ghost'}" onclick="go('${v}')">${l}</button>`).join(' ') + ' ' + (me ? `<button class="${view === 'orders' ? 'on' : 'ghost'}" onclick="go('orders')">Alerts${unread ? ` (${unread})` : ''}</button> <button class="ghost" onclick="logout()">Log out (${esc(me.name)})</button>` : `<button class="${view === 'login' ? 'on' : 'ghost'}" onclick="go('login')">Log in</button>`);
  try { $('#app').innerHTML = await V[view](); }
  catch (e) { if (e.message === 'Please log in') logout(); else $('#app').innerHTML = `<p>${esc(e.message)}</p>`; }
}
async function readNotification(id) { try { await api('/notifications/' + id + '/read', 'PATCH'); draw(); } catch (e) { flash(e.message); } }
async function authGo(mode) {
  try {
    const d = await api('/' + mode, 'POST', { name: $('#nm').value, email: $('#em').value, password: $('#pw').value });
    tok = localStorage.tok = d.token; me = d.user; localStorage.me = JSON.stringify(me);
    go(me.role === 'admin' ? 'admin' : 'services'); flash('Logged in');
  } catch (e) { flash(e.message); }
}
function logout() { tok = me = null; localStorage.removeItem('tok'); localStorage.removeItem('me'); go('services'); }
async function order() {
  if (!tok) return go('login');
  try {
    await api('/orders', 'POST', { items: cart, address: $('#addr').value, date: $('#date').value, notes: $('#notes').value });
    cart = []; localStorage.cart = '[]'; cat = await api('/catalog'); go('orders'); flash('Order placed');
  } catch (e) { flash(e.message); }
}
async function setStatus(id, status) { try { await api('/orders/' + id, 'PATCH', { status }); flash('Status updated'); } catch (e) { flash(e.message); } }
async function addProduct() {
  try {
    await api('/products', 'POST', { name: $('#pn').value, category: $('#pc').value, brand: $('#pb').value, variant: $('#pv').value, compatibility: $('#pco').value, size: $('#psz').value, imageUrl: $('#pi').value, desc: $('#pd').value, price: $('#pp').value, stock: $('#ps').value });
    cat = await api('/catalog'); draw(); flash('Accessory added');
  } catch (e) { flash(e.message); }
}
async function delProduct(id) { await api('/products/' + id, 'DELETE'); cat = await api('/catalog'); draw(); flash('Accessory deleted'); }

api('/catalog').then(c => { cat = c; draw(); });
</script></body></html>
