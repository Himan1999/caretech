<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eldavise | Friendly digital help at home</title>
    <style>
      :root {
        --bg: #f5f7f2;
        --ink: #17352f;
        --card: #fff;
        --acc: #176b5b;
        --acc-dark: #0d5045;
        --onacc: #fff;
        --hi: #f2a65a;
        --mut: #61726d;
        --line: #dbe5df;
        --soft: #e7f0eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.55 "Trebuchet MS",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 14px max(20px, calc((100% - 1120px) / 2));
        background: rgba(255, 255, 255, 0.94);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(12px);
      }
      .logo {
        font-size: 25px;
        font-weight: 900;
        letter-spacing: -1px;
        margin-right: auto;
        color: var(--ink);
        text-decoration: none;
      }
      .logo:hover {
        color: var(--acc);
      }
      .logo i {
        font-style: normal;
        color: var(--acc);
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        border-radius: 7px;
        padding: 9px 15px;
        background: var(--acc);
        color: var(--onacc);
        font-weight: 700;
        transition:
          transform 0.15s,
          background 0.15s;
      }
      button:hover {
        background: var(--acc-dark);
        transform: translateY(-1px);
      }
      button.ghost {
        background: none;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      button.ghost:hover {
        background: var(--soft);
      }
      nav button.on {
        background: var(--ink);
        color: #fff;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--hi);
        outline-offset: 1px;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 36px 24px 80px;
      }
      h1 {
        font-size: clamp(30px, 5vw, 52px);
        line-height: 1.05;
        letter-spacing: -1.5px;
        margin: 8px 0 14px;
      }
      .lead {
        color: var(--mut);
        max-width: 60ch;
        margin: 0 0 28px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 32px;
        align-items: center;
        margin-bottom: 46px;
      }
      .hero-copy {
        padding: 18px 0;
      }
      .hero-copy h1 {
        max-width: 620px;
      }
      .eyebrow {
        color: var(--acc);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .hero-image {
        width: 100%;
        height: 310px;
        object-fit: cover;
        border-radius: 14px;
        box-shadow: 18px 18px 0 var(--soft);
      }
      .trust {
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        margin-top: 24px;
        color: var(--mut);
        font-size: 14px;
      }
      .trust b {
        color: var(--ink);
        display: block;
        font-size: 18px;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 15px;
        margin-bottom: 18px;
      }
      .section-heading h2 {
        margin: 0;
        font-size: 27px;
        letter-spacing: -0.5px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        box-shadow: 0 7px 20px rgba(23, 53, 47, 0.05);
      }
      .card-image {
        width: calc(100% + 36px);
        height: 165px;
        object-fit: cover;
        margin: -18px -18px 10px;
        border-radius: 10px 10px 0 0;
      }
      .card h3 {
        margin: 0;
        font-size: 19px;
      }
      .card p {
        margin: 0;
        color: var(--mut);
      }
      .card .btn-row {
        margin-top: auto;
        padding-top: 12px;
      }
      .price {
        color: var(--ink) !important;
        font-weight: 800;
        font-size: 21px;
        margin-top: 4px !important;
      }
      .tag {
        display: inline-block;
        background: var(--soft);
        color: var(--acc-dark);
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 800;
        align-self: flex-start;
      }
      .product-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .product-meta .tag {
        font-weight: 600;
      }
      .admin-form {
        max-width: 620px;
      }
      .admin-form .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .admin-form .full {
        grid-column: 1/-1;
      }
      .filter-bar {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr;
        gap: 10px;
        margin: 0 0 24px;
        padding: 14px;
        background: var(--soft);
        border-radius: 10px;
      }
      .filter-bar input,
      .filter-bar select {
        background: #fff;
      }
      .results-note {
        color: var(--mut);
        font-size: 13px;
        margin: -12px 0 18px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .form {
        display: grid;
        gap: 10px;
        max-width: 440px;
        margin-top: 10px;
      }
      .auth-form [hidden] {
        display: none !important;
      }
      .field-error,
      .field-success {
        display: block;
        min-height: 17px;
        margin-top: -2px;
        margin-bottom: 2px;
        font-size: 12px;
        line-height: 1.4;
      }
      .field-error {
        color: #c0392b;
      }
      .field-success {
        color: #218739;
      }
      .field-error:empty,
      .field-success:empty {
        display: none;
      }
      .phone-field {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr);
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
        background: var(--card);
      }
      .phone-field:focus-within {
        outline: 3px solid var(--hi);
        outline-offset: 1px;
      }
      .phone-flag,
      .phone-prefix {
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 11px;
        background: var(--soft);
        color: var(--ink);
        font-weight: 700;
      }
      .phone-flag {
        gap: 7px;
        border-right: 1px solid var(--line);
      }
      .phone-prefix {
        border-right: 1px solid var(--line);
        font-size: 14px;
      }
      .phone-field input,
      .phone-field input:focus {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        border-radius: 0;
        box-shadow: none;
      }
      input,
      textarea,
      select {
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        width: 100%;
      }
      .auth-shell {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        grid-template-rows: minmax(0, 1fr);
        width: 100%;
        max-width: 900px;
        height: 560px !important;
        min-height: 560px;
        max-height: 560px;
        margin: 16px auto 30px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(23, 53, 47, 0.1);
      }
      .auth-art {
        position: relative;
        min-height: 0;
        background: var(--ink);
        color: #fff;
        padding: 34px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }
      .auth-art:after {
        content: "";
        position: absolute;
        inset: auto -80px -100px auto;
        width: 280px;
        height: 280px;
        border: 44px solid var(--hi);
        border-radius: 50%;
        opacity: 0.85;
      }
      .auth-art-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.34;
      }
      .auth-art-content {
        position: relative;
        z-index: 1;
      }
      .auth-art .eyebrow,
      .auth-art h2,
      .auth-art-content p {
        color: #fff;
      }
      .auth-art h2 {
        font-size: 34px;
        line-height: 1.08;
        letter-spacing: -1px;
        margin: 10px 0 14px;
      }
      .auth-art p {
        max-width: 28ch;
      }
      .auth-points {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 10px;
      }
      .auth-points span {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
      }
      .auth-points b {
        display: grid;
        place-items: center;
        width: 23px;
        height: 23px;
        border-radius: 50%;
        background: var(--hi);
        color: var(--ink);
        font-size: 13px;
      }
      .auth-form {
        min-height: 0;
        padding: 40px 46px;
        overflow: hidden;
      }
      .auth-form h1 {
        font-size: 38px;
        margin-top: 0;
      }
      .auth-form .form {
        max-width: none;
        margin-top: 20px;
        gap: 8px;
      }
      .auth-form label {
        font-size: 13px;
        font-weight: 800;
        color: var(--mut);
        margin-top: 2px;
      }
      .auth-actions {
        display: grid;
        gap: 10px;
        margin-top: 8px;
      }
      .auth-actions button {
        width: 100%;
      }
      .text-button {
        background: none;
        color: var(--acc);
        padding: 4px 0;
        text-align: left;
        justify-self: start;
      }
      .text-button:hover {
        background: none;
        color: var(--acc-dark);
        transform: none;
      }
      .auth-note {
        color: var(--mut);
        font-size: 13px;
        margin: 14px 0 0;
        text-align: center;
      }
      .register-form,
      .auth-shell:has(#regName) .auth-form {
        padding-top: 30px;
        padding-bottom: 20px;
      }
      .register-form h1,
      .auth-shell:has(#regName) h1 {
        font-size: 34px;
        margin-bottom: 6px;
      }
      .register-form .lead,
      .auth-shell:has(#regName) .lead {
        margin-bottom: 10px;
      }
      .register-form .form,
      .auth-shell:has(#regName) .form {
        margin-top: 10px;
        gap: 5px;
      }
      .notice-panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        margin: 0 0 24px;
        box-shadow: 0 7px 20px rgba(23, 53, 47, 0.05);
      }
      .notice-panel .section-heading {
        margin-bottom: 8px;
      }
      .notice-panel .section-heading span {
        color: var(--mut);
        font-size: 13px;
      }
      .notice {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 13px 0;
        border-top: 1px solid var(--line);
      }
      .notice.unread {
        border-left: 3px solid var(--hi);
        padding-left: 12px;
      }
      .notice p {
        margin: 2px 0;
        color: var(--mut);
      }
      .notice small {
        color: var(--mut);
        font-size: 12px;
      }
      .admin-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 20px;
      }
      .admin-head h1 {
        margin-bottom: 8px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 34px;
      }
      .status-metrics {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 14px;
        margin: -16px 0 34px;
      }
      .status-metric {
        background: var(--soft);
        color: var(--ink);
      }
      .status-metric span,
      .status-metric small {
        color: var(--mut);
      }
      .status-metric b {
        color: var(--ink);
      }
      .metric {
        background: var(--ink);
        color: #fff;
        border-radius: 10px;
        padding: 18px;
      }
      .metric span,
      .metric small {
        display: block;
        color: #a8c0b5;
        font-size: 13px;
      }
      .metric b {
        display: block;
        color: #fff;
        font-size: 30px;
        margin: 5px 0;
      }
      .admin-section {
        margin-bottom: 36px;
      }
      .completed-orders {
        border-top: 1px solid var(--line);
        padding-top: 28px;
      }
      #msg {
        position: fixed;
        top: 86px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
        width: min(560px, calc(100% - 32px));
        text-align: center;
        z-index: 10;
      }
      .site-footer {
        background: var(--ink);
        color: #d8e8df;
        padding: 34px max(24px, calc((100% - 1120px) / 2)) 22px;
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        gap: 30px;
      }
      .site-footer h2 {
        color: #fff;
        margin: 0 0 8px;
        font-size: 22px;
      }
      .site-footer h3 {
        color: var(--hi);
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin: 4px 0 10px;
      }
      .site-footer p {
        color: #a8c0b5;
        margin: 0;
        max-width: 30ch;
      }
      .footer-links {
        display: grid;
        align-content: start;
        gap: 4px;
      }
      .footer-links button {
        background: none;
        color: #d8e8df;
        padding: 2px 0;
        text-align: left;
        font-weight: 400;
      }
      .footer-links button:hover {
        color: #fff;
        transform: none;
      }
      .footer-bottom {
        grid-column: 1/-1;
        border-top: 1px solid rgba(216, 232, 223, 0.18);
        padding-top: 16px;
        color: #a8c0b5;
        font-size: 13px;
      }
      #msg:empty {
        display: none;
      }
      .dashboard-lower {
        grid-template-columns: 1.1fr 1fr 1fr 1.1fr;
      }
      .channel-row {
        display: grid;
        grid-template-columns: 92px minmax(35px, 1fr) 40px;
        gap: 8px;
        align-items: center;
        font-size: 12px;
      }
      .channel-track {
        height: 9px;
        background: var(--soft);
        border-radius: 99px;
        overflow: hidden;
      }
      .channel-fill {
        height: 100%;
        background: #edc451;
        border-radius: 99px;
      }
      .recent-activity {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        margin: 18px 0 24px;
      }
      .activity-filters {
        display: flex;
        gap: 4px;
        padding: 3px;
        background: var(--soft);
        border-radius: 8px;
      }
      .activity-filters button {
        background: transparent;
        color: var(--mut);
        padding: 6px 10px;
        font-size: 11px;
      }
      .activity-filters button.active {
        background: var(--ink);
        color: #fff;
      }
      .activity-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .activity-table th,
      .activity-table td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .activity-table th {
        color: var(--mut);
        font-size: 11px;
        font-weight: 700;
      }
      .activity-table tr:last-child td {
        border-bottom: 0;
      }
      .activity-area {
        color: var(--mut);
      }
      .pipeline-bar i:nth-child(5) {
        background: #c65a4a;
      }
      @media (max-width: 1050px) {
        .admin-overview {
          grid-template-columns: 1fr;
        }
        .overview-stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .dashboard-lower {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        .overview-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .revenue-head {
          display: block;
        }
        .period-switch {
          width: max-content;
          margin-top: 12px;
        }
        .dashboard-lower {
          grid-template-columns: 1fr;
        }
        .revenue-head h2 {
          font-size: 30px;
        }
      }
      .admin-overview {
        display: grid;
        grid-template-columns: minmax(0, 1.8fr) minmax(290px, 1fr);
        gap: 14px;
        margin-bottom: 16px;
      }
      .revenue-overview {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        min-width: 0;
      }
      .revenue-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 18px;
      }
      .revenue-head h2 {
        margin: 4px 0;
        font-size: 36px;
      }
      .revenue-change {
        font-size: 12px;
        color: #27834a;
      }
      .period-switch {
        display: flex;
        gap: 3px;
        padding: 3px;
        border-radius: 8px;
        background: var(--soft);
        white-space: nowrap;
      }
      .period-switch button {
        background: transparent;
        color: var(--mut);
        padding: 6px 9px;
        font-size: 11px;
      }
      .period-switch button.active {
        background: var(--ink);
        color: #fff;
      }
      .revenue-svg {
        display: block;
        width: 100%;
        height: 205px;
        margin-top: 10px;
        overflow: visible;
      }
      .revenue-area-path {
        fill: #f7e7ba;
      }
      .revenue-stroke {
        fill: none;
        stroke: #282722;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .revenue-gridline {
        stroke: var(--line);
        stroke-width: 1;
      }
      .revenue-axis {
        display: flex;
        justify-content: space-between;
        color: var(--mut);
        font-size: 10px;
        margin-top: -2px;
      }
      .overview-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .overview-stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        min-width: 0;
      }
      .overview-stat-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--mut);
        font-size: 12px;
      }
      .overview-stat strong {
        display: block;
        color: var(--ink);
        font-size: 25px;
        margin: 4px 0;
      }
      .overview-stat small {
        color: var(--mut);
        font-size: 11px;
      }
      .stat-spark {
        display: flex;
        align-items: end;
        gap: 3px;
        height: 32px;
        margin-top: 8px;
      }
      .stat-spark i {
        display: block;
        flex: 1;
        min-width: 2px;
        background: #f1d487;
        border-radius: 3px 3px 0 0;
      }
      .dashboard-lower {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 14px;
        margin-bottom: 20px;
      }
      .pipeline-card,
      .dashboard-lower .chart-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
      }
      .pipeline-bar {
        display: flex;
        height: 12px;
        overflow: hidden;
        border-radius: 99px;
        margin: 14px 0;
      }
      .pipeline-bar i:nth-child(1) {
        background: #efc65d;
      }
      .pipeline-bar i:nth-child(2) {
        background: #bd9137;
      }
      .pipeline-bar i:nth-child(3) {
        background: #353434;
      }
      .pipeline-bar i:nth-child(4) {
        background: #5b5a56;
      }
      .pipeline-legend {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        color: var(--mut);
        font-size: 12px;
      }
      .pipeline-legend b {
        float: right;
        color: var(--ink);
      }
      .seller-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) 28px;
        gap: 8px;
        align-items: center;
        color: var(--mut);
        font-size: 11px;
      }
      .seller-row > div {
        display: grid;
        gap: 6px;
      }
      .seller-row > b {
        color: var(--ink);
        text-align: right;
      }
      .alert-bell {
        position: relative;
        width: 42px;
        height: 42px;
        padding: 0;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        font-size: 20px;
        line-height: 1;

            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const validEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const canadianPhoneDigits = (value) => {
        let digits = String(value || "").replace(/\D/g, "");
        if (digits.length === 11 && digits.startsWith("1"))
          digits = digits.slice(1);
        return digits.length === 10 ? digits : "";
      };
      const validCanadianPhone = (value) =>
        /^[2-9]\d{2}[2-9]\d{6}$/.test(canadianPhoneDigits(value));
      const formatCanadianPhone = (value) => {
        const digits = canadianPhoneDigits(value);
        return digits
          ? `+1 (${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`
          : value || "Not provided";
      };
      function validateCanadianPhoneInput(input) {
        let digits = String(input.value || "").replace(/\D/g, "");
        if (digits.length === 11 && digits.startsWith("1"))
          digits = digits.slice(1);
        input.value = digits.slice(0, 10);
        const error = $("#phoneError");
        if (error)
          error.textContent =
            input.value && !validCanadianPhone(input.value)
              ? input.value.length < 10
                ? "Enter all 10 digits after +1"
                : "Enter a valid Canadian area code and number"
              : "";
      }
      function validateCanadianPhoneField(required = false) {
        const input = $("#phone"),
          error = $("#phoneError");
        if (!input || !error) return !required;
        const digits = canadianPhoneDigits(input.value);
        const message = !digits
          ? required
            ? "Enter a 10-digit Canadian phone number"
            : input.value
              ? "Enter all 10 digits after +1"
              : ""
          : !validCanadianPhone(digits)
            ? "Enter a valid Canadian area code and number"
            : "";
        error.textContent = message;
        return !message;
      }
      function enhanceCanadianPhone() {
        const input = $("#phone");
        if (!input) return;
        input.value = canadianPhoneDigits(input.value);
        input.maxLength = 10;
        input.inputMode = "numeric";
        input.autocomplete = "tel-national";
        input.placeholder = "416 555 0123";
        input.setAttribute(
          "aria-label",
          "Canadian phone number, country code +1",
        );
        if (!input.closest(".phone-field")) {
          const field = document.createElement("div");
          field.className = "phone-field";
          const flag = document.createElement("span");
          flag.className = "phone-flag";
          flag.textContent = "🇨🇦 Canada";
          const prefix = document.createElement("span");
          prefix.className = "phone-prefix";
          prefix.textContent = "+1";
          input.parentNode.insertBefore(field, input);
          field.append(flag, prefix, input);
          const error = document.createElement("small");
          error.id = "phoneError";
          error.className = "field-error";
          field.after(error);
        }
        input.oninput = () => validateCanadianPhoneInput(input);

tat-spark">${spark(cat.products.slice(0, 7).map((product) => Math.max(0, 6 - product.stock)))}</div></article><article class="overview-stat"><div class="overview-stat-head"><span>Average order</span><span>›</span></div><strong>${money(average)}</strong><small>Net revenue per order</small><div class="stat-spark">${spark(sevenSales)}</div></article></div></div>`;

    <div class="row"><b>Total</b><b>${money(total())}</b></div>
    <h3>Service visit and delivery details</h3>

        "guest-confirmation": () =>
          guestOrderResult

            : "<h1>No guest booking to show</h1><button onclick=\"navigatePage('services')\">Browse services</button>",

        login: () =>
          `<section class="auth-shell"><div class="auth-art">${image("s3", "A person using a smartphone", "auth-art-image")}<div class="auth-art-content"><span class="eyebrow">Welcome back</span><h2>Your tech, taken care of.</h2><p>Keep your bookings, support history and device details in one calm, convenient place.</p></div><div class="auth-points"><span><b>✓</b> Track every service visit</span><span><b>✓</b> Reorder useful accessories</span><span><b>✓</b> Get help without the jargon</span></div></div><div class="auth-form"><span class="eyebrow">Eldavise account</span><h1>Sign in and get sorted.</h1><p class="lead">Access your orders and book your next visit.</p><div class="form"><label for="em">Email address</label><input id="em" type="email" value="${esc(registrationEmail)}" placeholder="you@example.com" oninput="checkAccountEmail(); validateEmailField('em','loginEmailError')"><small id="loginEmailError" class="field-error"></small><label for="pw">Password</label><input id="pw" type="password" placeholder="Your password" oninput="$('#loginPasswordError').textContent = ''"><small id="loginPasswordError" class="field-error"></small><button onclick="authGo('login')">Log in to Eldavise</button><button class="text-button" onclick="go('forgot')">Forgot password?</button><button class="text-button" onclick="go('register')">Create a new account</button></div><p class="auth-note">Your details stay private and are only used to manage your Eldavise orders.</p></div></section>`,

        register: () =>
          `<section class="auth-shell"><div class="auth-art">${image("s3", "A person using a smartphone", "auth-art-image")}<div class="auth-art-content"><span class="eyebrow">Join Eldavise</span><h2>Get your tech, taken care of.</h2><p>Create an account to book services, manage orders, and keep your support history in one place.</p></div><div class="auth-points"><span><b>✓</b> Track every service visit</span><span><b>✓</b> Reorder useful accessories</span><span><b>✓</b> Get help without the jargon</span></div></div><div class="auth-form"><span class="eyebrow">Eldavise account</span><h1>Create your account.</h1><p class="lead">Set up your account in a few seconds.</p><div class="form"><label for="regName">Full name</label><input id="regName" placeholder="Your name"><label for="regEmail">Email address</label><input id="regEmail" type="email" value="${esc(registrationEmail)}" placeholder="you@example.com" oninput="validateEmailField('regEmail','registerEmailError')"><small id="registerEmailError" class="field-error"></small><label for="regPassword">Password</label><input id="regPassword" type="password" placeholder="8+ characters, uppercase, lowercase, number" oninput="validatePasswordField('regPassword','registerPasswordError'); validateMatchField()"><small id="registerPasswordError" class="field-error"></small><label for="regConfirm">Confirm password</label><input id="regConfirm" type="password" placeholder="Repeat your password" oninput="validateMatchField()"><small id="registerConfirmError" class="field-error"></small><button onclick="registerAccount()">Create Eldavise account</button><button class="text-button" onclick="go('login')">Already have an account? Log in</button></div></div></section>`,

        forgot: () =>
          `<section class="auth-shell"><div class="auth-art">${image("s3", "A person using a smartphone", "auth-art-image")}<div class="auth-art-content"><span class="eyebrow">Account recovery</span><h2>We can help you get back in.</h2><p>Enter the email address on your Eldavise account and we will send a secure reset link.</p></div></div><div class="auth-form"><span class="eyebrow">Eldavise account</span><h1>Forgot your password?</h1><p class="lead">We will send a one-time reset link to the email address on your account.</p><div class="form"><label for="resetEmail">Email address</label><input id="resetEmail" type="email" placeholder="you@example.com" oninput="validateEmailField('resetEmail','resetEmailError')"><small id="resetEmailError" class="field-error"></small><button onclick="sendResetLink()">Send reset link</button><button class="text-button" onclick="go('login')">Back to login</button></div><p class="auth-note">The reset link expires after one hour and can only be used once.</p></div></section>`,

        reset: () =>
          `<section class="auth-shell"><div class="auth-art">${image("s3", "A person using a smartphone", "auth-art-image")}<div class="auth-art-content"><span class="eyebrow">Password recovery</span><h2>Choose a new password.</h2><p>Set a fresh password for your Eldavise account and get back to what you need.</p></div></div><div class="auth-form"><span class="eyebrow">Eldavise account</span><h1>Reset your password.</h1><p class="lead">Your reset link is valid for one hour and can only be used once.</p><div class="form"><label for="newPw">New password</label><input id="newPw" type="password" placeholder="8+ characters, uppercase, lowercase, number" oninput="validatePasswordField('newPw','resetPasswordError'); validateMatchField('newPw','confirmPw','resetConfirmError')"><small id="resetPasswordError" class="field-error"></small><label for="confirmPw">Confirm new password</label><input id="confirmPw" type="password" placeholder="Repeat your password" oninput="validateMatchField('newPw','confirmPw','resetConfirmError')"><small id="resetConfirmError" class="field-error"></small><button onclick="resetPassword()">Save new password</button></div></div></section>`,

        orders: async () =>
          `<h1>My orders</h1><p class="lead">Track your bookings, delivery details, and every Eldavise update.</p><div class="orders-layout"><section class="orders-main"><div class="stack">${ordersHtml(await api("/orders"), false)}</div></section><aside class="orders-notifications">${alertsHtml()}</aside></div>`,

        admin: async () => {
          const [os, summary, users] = await Promise.all([
            api("/orders"),
            api("/admin/summary"),
            api("/admin/users"),
          ]);
          const dashboardActive = os.filter(
            (order) => order.status !== "Completed",
          );
          const dashboardCompleted = os.filter(
            (order) => order.status === "Completed",
          );
          const adminShell = (content) =>
            `<div class="admin-dashboard">${adminSidebar()}<main class="admin-content">${content}</main></div>`;
          if (adminSection === "services")
            return adminShell(adminServicesPanel());
          if (adminSection === "accessories")
            return adminShell(adminAccessoriesPanel());
          if (adminSection === "users")
            return adminShell(adminUsersPanel(users));
          if (adminSection === "orders")
            return adminShell(
              `<div class="admin-page-head"><div><h1>Orders History</h1><p class="admin-breadcrumb">Dashboard &nbsp;›&nbsp; Orders</p></div></div><div class="admin-toolbar"><h2>Active orders</h2><input value="${esc(adminOrderSearch)}" placeholder="Search orders" onchange="adminOrderSearch=this.value; draw()"></div>${adminOrderTable(dashboardActive)}<section class="admin-section completed-orders"><div class="section-heading"><h2>Completed orders</h2><span class="lead">Completed work is kept here for reference.</span></div>${adminOrderTable(dashboardCompleted)}</section>`,
            );
          if (adminSection === "dashboard")
            return adminShell(
              `<div class="admin-page-head"><div><h1>Overview</h1><p class="admin-breadcrumb">What is selling and what needs attention.</p></div><button onclick="go('shop')">View storefront</button></div>${adminDashboardOverview(os, summary)}<div class="status-metrics">${adminStatusMetrics(os)}</div>${adminDashboardLower(os)}${adminRecentActivity(os)}`,
            );
          const completed = os.filter((order) => order.status === "Completed");
          const active = os.filter((order) => order.status !== "Completed");
          return `<div class="admin-dashboard"><aside class="admin-sidebar"><h2>Eldavise Admin</h2><button class="active" onclick="go('admin')">Dashboard</button><button onclick="go('services')">Services</button><button onclick="go('shop')">Accessories</button><button class="active" onclick="go('admin')">Orders</button><button onclick="go('orders')">Notifications</button></aside><main class="admin-content"><div class="admin-page-head"><div><h1>Orders History</h1><p class="admin-breadcrumb">Home &nbsp;›&nbsp; History</p></div><button onclick="go('shop')">View storefront</button></div><div class="status-metrics">${adminStatusMetrics(os)}</div><section class="admin-section"><div class="admin-toolbar"><div><h2>Active orders</h2><span class="lead">New work stays at the top for quick action.</span></div><input value="${esc(adminOrderSearch)}" placeholder="Search orders" onchange="adminOrderSearch=this.value; draw()"></div>${adminOrderTable(active)}</section><section class="admin-section completed-orders"><div class="section-heading"><h2>Completed orders</h2><span class="lead">Completed work is kept here for reference.</span></div>${adminOrderTable(completed)}</section><section class="admin-section"><h2>Add service</h2><div class="admin-form"><div class="form"><input id="serviceName" placeholder="Service name"><input id="servicePrice" type="number" min="0" step="0.01" placeholder="Price"><textarea id="serviceDescription" rows="3" placeholder="Service description"></textarea><button onclick="addService()">Add service</button></div></div><h2>Add accessory variant</h2><div class="admin-form"><div class="form form-grid"><input id="pn" placeholder="Product name"><select id="pc"><option value="Phone accessory">Phone accessory</option><option value="Phone case">Phone case</option><option value="Tempered glass">Tempered glass</option><option value="Ink cartridge">Ink cartridge</option><option value="Laptop sleeve">Laptop sleeve</option><option value="Cables">Cables</option><option value="Laptop">Laptop</option><option value="Printer">Printer</option><option value="Other">Other</option></select><input id="pb" placeholder="Brand (Apple, HP, Samsung)"><input id="pv" placeholder="Variant or model (iPhone 15 Pro, Black) "><input id="pco" placeholder="Compatibility (device or printer model)"><input id="psz" placeholder="Size (13-inch, XL, A4)"><input id="pp" type="number" step="0.01" placeholder="Price"><input id="ps" type="number" placeholder="Stock"><input id="pi" class="full" placeholder="Image URL (https://...)"><textarea id="pd" class="full" rows="2" placeholder="Description"></textarea><button class="full" onclick="addProduct()">Add accessory variant</button></div></div></section><h2>Accessories</h2>${cat.products.map((p) => `<div class="row"><span>${esc(p.name)}${p.brand ? ` — ${esc(p.brand)}` : ""}${p.variant ? ` / ${esc(p.variant)}` : ""} — ${money(p.price)} — ${p.stock} in stock</span><button class="ghost" onclick="delProduct('${p.id}')">Delete</button></div>`).join("")}</main></div>`;
        },
      };

      async function draw() {
        if (view === "admin" && me?.role !== "admin") {
          view = "login";
          history.replaceState({}, "", "/?view=login");
        }
        if (me && tok) {
          try {
            notifications = await api("/notifications");
          } catch {
            notifications = [];
          }
        }
        const tabs = [
          ["services", "Services"],
          ["shop", "Accessories"],
          ["cart", `Cart (${cart.reduce((n, c) => n + c.qty, 0)})`],
        ];
        if (me) tabs.push(["orders", "My orders"]);
        const unread = notifications.filter((n) => !n.isRead).length;
        $("#nav").innerHTML =
          tabs
            .map(
              ([v, l]) =>
                `<button class="${v === view ? "on" : "ghost"}" onclick="navigatePage('${v}')">${l}</button>`,
            )
            .join(" ") +
          " " +
          (me
            ? `${me.role === "admin" ? `<button class="${view === "admin" ? "on" : "ghost"}" onclick="navigatePage('admin')">Admin</button>` : ""}<button class="alert-bell ${view === "orders" ? "on" : ""}" title="Notifications" aria-label="Notifications" onclick="navigatePage('orders')">&#128276;${unread ? '<i class="unread-dot"></i>' : ""}</button> <button class="ghost" onclick="logout()">Log out (${esc(me.name)})</button>`
            : `<button class="${view === "login" ? "on" : "ghost"}" onclick="navigatePage('login')">Log in</button>`);
        try {
          $("#app").innerHTML = await V[view]();
          enhanceCanadianPhone();
        } catch (e) {
          if (e.message === "Please log in") logout();
          else $("#app").innerHTML = `<p>${esc(e.message)}</p>`;
        }
      }
      async function readNotification(id) {
        try {
          await api("/notifications/" + id + "/read", "PATCH");
          draw();
        } catch (e) {
          flash(e.message);
        }
      }
      async function authGo(mode) {
        const email = $("#em").value.trim();
        if (!validateEmailField("em", "loginEmailError")) return;
        try {
          const d = await api("/" + mode, "POST", {
            email,
            password: $("#pw").value,
          });
          tok = localStorage.tok = d.token;
          me = d.user;
          localStorage.me = JSON.stringify(me);
          sessionStorage.removeItem("pendingTrackingEmail");
          registrationEmail = "";
          if (me.role === "admin") navigatePage("admin");
          else navigatePage("services");
        } catch (e) {
          if (mode === "login" && e.message === "Wrong email or password")
            $("#loginPasswordError").textContent =
              "Incorrect password. Try again or use Forgot password.";
          else flash(e.message);
        }
      }
      function checkAccountEmail() {
        clearTimeout(accountCheckTimer);
        const email = $("#em").value.trim();
        if (!validEmail(email)) return;
        accountCheckTimer = setTimeout(async () => {
          try {
            const status = await api(
              "/account-status?email=" + encodeURIComponent(email),
            );
            if (!status.exists && $("#em").value.trim() === email) {
              registrationEmail = email;
              go("register");
            }
          } catch {}
        }, 300);
      }
      function validateEmailField(inputId, errorId) {
        const input = $("#" + inputId),
          error = $("#" + errorId),
          email = input.value.trim();
        const message = !email
          ? "Email address is required"
          : !validEmail(email)
            ? "Enter a valid email address"
            : "";
        error.textContent = message;
        return !message;
      }
      function validatePasswordField(inputId, errorId) {
        const password = $("#" + inputId).value,
          error = $("#" + errorId);
        const message = !password
          ? "Password is required"
          : password.length < 8
            ? "Use at least 8 characters"
            : !/[A-Z]/.test(password)
              ? "Add at least one uppercase letter"
              : !/[a-z]/.test(password)
                ? "Add at least one lowercase letter"
                : !/\d/.test(password)
                  ? "Add at least one number"
                  : "";
        error.textContent = message;
        return !message;
      }
      function validateMatchField(
        passwordId = "regPassword",
        confirmationId = "regConfirm",
        errorId = "registerConfirmError",
      ) {
        const password = $("#" + passwordId).value,
          confirmation = $("#" + confirmationId).value,
          error = $("#" + errorId);
        const message =
          confirmation && password !== confirmation
            ? "Password do not match"
            : "";
        error.className = message
          ? "field-error"
          : confirmation
            ? "field-success"
            : "field-error";
        error.textContent = message || (confirmation ? "Password Matched" : "");
        return !message;
      }
      async function registerAccount() {
        const name = $("#regName").value.trim(),
          email = $("#regEmail").value.trim(),
          password = $("#regPassword").value,
          confirmation = $("#regConfirm").value;
        if (!name) return flash("Enter your name");
        if (
          !validateEmailField("regEmail", "registerEmailError") ||
          !validatePasswordField("regPassword", "registerPasswordError") ||
          !validateMatchField()
        )
          return;
        try {
          const d = await api("/register", "POST", { name, email, password });
          tok = localStorage.tok = d.token;
          me = d.user;
          localStorage.me = JSON.stringify(me);
          sessionStorage.removeItem("pendingTrackingEmail");
          registrationEmail = "";
          navigatePage("services");
        } catch (e) {
          if (e.message === "This email is already registered")
            $("#registerEmailError").textContent = e.message;
          else flash(e.message);
        }
      }
      async function sendResetLink() {
        const email = $("#resetEmail").value.trim();
        if (!validateEmailField("resetEmail", "resetEmailError")) return;
        try {
          const d = await api("/forgot-password", "POST", { email });
          flash(d.message);
        } catch (e) {
          flash(e.message);
        }
      }
      async function resetPassword() {
        const password = $("#newPw").value,
          confirmation = $("#confirmPw").value;
        if (
          !validatePasswordField("newPw", "resetPasswordError") ||
          !validateMatchField("newPw", "confirmPw", "resetConfirmError")
        )
          return;
        try {
          const d = await api("/reset-password", "POST", {
            token: resetToken,
            password,
          });
          history.replaceState({}, "", location.pathname);
          resetToken = "";
          go("login");
          flash(d.message);
        } catch (e) {
          flash(e.message);
        }
      }
      async function addService() {
        try {
          await api("/services", "POST", {
            name: $("#serviceName").value,
            desc: $("#serviceDescription").value,
            price: $("#servicePrice").value,
          });
          cat = await api("/catalog");
          draw();
          flash("Service added");
        } catch (e) {
          flash(e.message);
        }
      }
      function logout() {
        tok = me = null;
        localStorage.removeItem("tok");
        localStorage.removeItem("me");
        go("services");
      }
      async function order() {
        const guest = !tok;
        const isServiceOnly =
          cart.length > 0 &&
          cart.every((cartItem) => cartItem.type === "service");
        const hasService = cart.some((cartItem) => cartItem.type === "service");
        if (guest && !isServiceOnly) return go("login");
        const rawPhone = $("#phone")?.value.trim() || "";
        if (hasService && !validateCanadianPhoneField(true)) return;
        if (!hasService && rawPhone && !validateCanadianPhoneField()) return;
        const digits = canadianPhoneDigits(rawPhone);
        const phone = digits ? `+1${digits}` : "";
        const customerName = guest ? $("#guestName").value.trim() : "";
        const customerEmail = guest ? $("#guestEmail").value.trim() : "";
        if (guest && !customerName)
          return flash("Enter your name to book the service");
        if (guest && !validEmail(customerEmail))
          return flash("Enter a valid email address");
        try {
          const result = await api("/orders", "POST", {
            items: cart,
            address: $("#addr").value,
            phone,
            date: $("#date").value,
            notes: $("#notes").value,
            customerName,
            customerEmail,
          });
          cart = [];
          localStorage.cart = "[]";
          if (result.guest) {
            guestOrderResult = result;
            registrationEmail = result.email;
            go("guest-confirmation");
          } else {
            cat = await api("/catalog");
            go("orders");
            flash("Order placed");
          }
        } catch (e) {
          flash(e.message);
        }
      }
      async function setStatus(id, status) {
        try {
          await api("/orders/" + id, "PATCH", { status });
          flash("Status updated");
          draw();
        } catch (e) {
          flash(e.message);
        }
      }
      async function addProduct() {
        try {
          await api("/products", "POST", {
            name: $("#pn").value,
            category: $("#pc").value,
            brand: $("#pb").value,
            variant: $("#pv").value,
            compatibility: $("#pco").value,
            size: $("#psz").value,
            imageUrl: $("#pi").value,
            desc: $("#pd").value,
            price: $("#pp").value,
            stock: $("#ps").value,
          });
          cat = await api("/catalog");
          draw();
          flash("Accessory added");
        } catch (e) {
          flash(e.message);
        }
      }
      async function delProduct(id) {
        await api("/products/" + id, "DELETE");
        cat = await api("/catalog");
        draw();
        flash("Accessory deleted");
      }

      api("/catalog").then((c) => {
        cat = c;
        draw();
      });
    </script>
    <style>

        grid-template-columns: 1.1fr 1fr 1fr 1.1fr;
      }
      @media (max-width: 1050px) {
        .admin-dashboard .dashboard-lower {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        .admin-dashboard .dashboard-lower {
          grid-template-columns: 1fr;
        }
      }
      .admin-dashboard {
        --admin-ink: #202126;
        --admin-gold: #e8bf4c;
        --admin-line: #e7e3d8;
      }
      .admin-dashboard .admin-sidebar {
        background: #faf9f5;
        border-color: var(--admin-line);
      }
      .admin-dashboard .admin-sidebar button.active,
